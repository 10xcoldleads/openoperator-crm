name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned Twenty provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: twentyhq/twenty
          ref: 1f55234d0bd1abe20e5615dc5830b254a54831ef
          path: twenty-reference
          sparse-checkout: |
            packages/twenty-front/src/modules/object-record/record-calendar/month/hooks/useRecordCalendarMonthDaysRange.tsx
            packages/twenty-front/src/modules/object-record/record-calendar/month/utils/getRecordCalendarDateRangeOverlapFilter.ts
            packages/twenty-front/src/modules/object-record/record-merge/hooks/usePerformMergePreview.ts
            packages/twenty-front/src/modules/object-record/record-merge/utils/mergeRelationshipData.ts
            packages/twenty-server/src/engine/metadata-modules/view-permissions/services/view-access.service.ts
            packages/twenty-server/src/engine/metadata-modules/webhook/utils/generate-webhook-secret.util.ts
            packages/twenty-server/src/engine/metadata-modules/webhook/utils/transform-event-to-webhook-event.ts
            packages/twenty-shared/src/application/pageLayoutManifestType.ts
            packages/twenty-shared/src/application/roleManifestType.ts
            packages/twenty-shared/src/application/viewManifestType.ts
            packages/twenty-shared/src/workflow/validation/utils/build-workflow-graph.util.ts
            packages/twenty-shared/src/workflow/validation/validate-workflow-structure.util.ts
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Run complete verification suite
        run: npm test
        env:
          TWENTY_REFERENCE_ROOT: twenty-reference
